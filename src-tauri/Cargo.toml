[package]
name = "tenling"
version = "0.3.3"
description = "TenLing — calm cross-platform Markdown viewer and editor"
authors = ["SihanTeng"]
edition = "2021"

[lib]
name = "tenling_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
app-store = []

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
trash = "5"

# Direct PDF export on Linux drives the WebKitGTK print operation (see
# export_pdf in lib.rs). Pinned: Tauri may bump these crates in minors.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "=0.18.2"
webkit2gtk = "=2.0.2"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSURL", "NSData", "NSString", "NSArray", "NSError"] }
